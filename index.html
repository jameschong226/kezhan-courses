<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课栈｜精选课程</title>
<meta name="description" content="课栈：精选线上课程。转一转课程转盘，看看每门课的讲师、重点和官方页面。">
<meta property="og:title" content="课栈｜精选课程">
<meta property="og:description" content="精选线上课程。每门课附封面、讲师、重点和官方页面链接。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<link rel="stylesheet" href="vendor/lenis.css">
<link rel="stylesheet" href="site.css">
<style>
/* hero: headline left, spotlight index card right */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(12px,2.6vw,32px) 0;position:relative;z-index:2}
.hero-text{display:grid;gap:16px;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5.8vw,82px);line-height:1.05;margin:0}
.hero h1 .line{display:block}
.hero h1 em{font-style:normal;color:var(--accent);position:relative;display:inline-block}
.hero h1 em svg{position:absolute;left:-2%;bottom:-.08em;width:104%;height:.22em;overflow:visible}
.hero h1 em path{fill:none;stroke:var(--mark);stroke-width:7;stroke-linecap:round}
.hero p{margin:0;color:var(--muted);font-size:clamp(15px,1.4vw,17px);max-width:30em}
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ghost{font-size:14px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.ghost:hover{color:var(--ink);border-color:var(--ink)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.stats div{display:grid}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:clamp(26px,3.2vw,38px);line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);margin-top:6px}

/* spotlight */
.spot{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:3px;box-shadow:0 40px 70px -46px var(--shadow);min-width:0}
.spot::before{content:"";position:absolute;inset:10px -10px -10px 10px;border:1px solid var(--line);border-radius:3px;z-index:-1;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.spot-tag{position:absolute;top:-13px;left:18px;background:var(--rule);color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;padding:4px 10px;border-radius:2px;z-index:2}
.spot-cover{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface))}
.spot-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease)}
.spot:hover .spot-cover img{transform:scale(1.05)}
.spot-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 8px;border-bottom:2px solid var(--rule)}
.spot-cat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--c)}
.spot-cat i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.spot-no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.spot-body{padding:6px 18px 4px;line-height:28px;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--ruled) 27px 28px);min-height:112px}
.spot-body h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:28px;margin:0;text-wrap:balance}
.spot-body h2 a{text-decoration:none}
.spot-body h2 a:hover{text-decoration:underline}
.spot-who{font-size:14px;color:var(--muted)}
.spot-learn{font-size:14px}
.spot-learn span{color:var(--muted)}
.spot-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 16px;flex-wrap:wrap}
.spot-nav{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spot-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.spot-nav button:hover{border-color:var(--ink)}
.spot-nav b{color:var(--ink);font-weight:500}
.go{font-size:14px;font-weight:500;text-decoration:none;color:var(--accent)}
.go:hover{text-decoration:underline}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);transform-origin:left;transform:scaleX(0)}
.bar i.run{animation:fillbar 5.5s linear forwards}
.spot:hover .bar i,.bar i.hold{animation-play-state:paused}
@keyframes fillbar{to{transform:scaleX(1)}}

/* 3D turntable */
.stage{position:relative;height:clamp(300px,30vw,380px);perspective:1800px;perspective-origin:50% 20%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;margin-top:-56px}
.stage.dragging{cursor:grabbing}
.floor{position:absolute;left:50%;top:calc(30% + var(--sw,156px) * .62);width:var(--fw,1100px);height:calc(var(--fw,1100px) * .3);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:
    radial-gradient(closest-side,color-mix(in srgb,var(--mark) 22%,transparent),transparent 70%) 50% 85%/40% 40% no-repeat,
    repeating-radial-gradient(closest-side,transparent 0 22px,color-mix(in srgb,var(--line) 85%,transparent) 22px 23px),
    radial-gradient(closest-side,color-mix(in srgb,var(--surface) 70%,transparent),transparent);
  -webkit-mask:radial-gradient(closest-side,#000 70%,transparent);mask:radial-gradient(closest-side,#000 70%,transparent)}
.ring{position:absolute;left:50%;top:30%;width:0;height:0;transform-style:preserve-3d}
.slot{position:absolute;left:0;top:0;width:var(--sw,156px);margin-left:calc(var(--sw,156px) / -2);margin-top:calc(var(--sw,156px) * -.75);
  background:var(--surface);border:1px solid var(--line);border-radius:2px;text-decoration:none;color:inherit;will-change:transform,opacity;
  box-shadow:0 18px 30px -22px var(--shadow);transition:box-shadow .4s,border-color .4s}
.slot .sc{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.slot .sc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.slot .sc .cover-ph b{font-size:34px}
.slot .sh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 4px;border-bottom:1.5px solid var(--rule);font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.slot .sh i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.slot .st{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:20px;padding:6px 10px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:50px}
.slot.front{border-color:var(--ink);box-shadow:0 34px 50px -28px var(--shadow)}
.slot.front .sh{color:var(--ink)}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.hint::before,.hint::after{content:"";width:22px;height:1px;background:var(--line)}

/* library panel */
.library{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 75%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:clamp(24px,4vw,48px);border-radius:3px;margin-bottom:56px;position:relative;overflow:hidden}
.library h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4.6vw,56px);line-height:1.1;margin:8px 0 10px}
.library p{margin:0 0 22px;color:var(--muted);max-width:30em}
.fan{position:relative;width:260px;height:180px}
.fan span{position:absolute;inset:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--surface);box-shadow:0 20px 30px -22px var(--shadow);transition:transform .7s var(--ease)}
.fan img{width:100%;height:100%;object-fit:cover;display:block}
.fan span:nth-child(1){transform:rotate(-9deg) translate(-26px,8px)}
.fan span:nth-child(2){transform:rotate(-2deg) translate(0,0)}
.fan span:nth-child(3){transform:rotate(7deg) translate(26px,6px)}
.library:hover .fan span:nth-child(1){transform:rotate(-16deg) translate(-70px,14px)}
.library:hover .fan span:nth-child(3){transform:rotate(14deg) translate(70px,10px)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .spot{max-width:560px}
}
@media (max-width:640px){
  .library{grid-template-columns:1fr}
  .fan{width:220px;height:150px;justify-self:center;margin-top:8px}
}
@media (prefers-reduced-motion:reduce){.bar{display:none}.stage{cursor:default}}
</style>
</head>
<body>
<canvas id="aurora" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ring-cursor" aria-hidden="true"><span>看课</span></div>

<div class="gut"><div class="wrap">
  <header class="top">
    <a class="brand" href="./"><b>课栈</b><span>精选课程</span></a>
    <nav class="nav" aria-label="主导航">
      <a href="./" aria-current="page">首页</a>
      <a href="courses.html">课程目录</a>
      <a href="courses.html#saved">我的收藏<span class="n" data-saved-n>0</span></a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <div class="eyebrow">Catalogue · 精选课程</div>
      <h1 id="headline"><span class="line">好课，</span><span class="line">值得<em>一看再看<svg viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M4 14 C 80 4, 160 4, 296 10"/></svg></em>。</span></h1>
      <p id="lede">整理过、值得推荐的线上课程。转一转下面的课程转盘，看看每门课在讲什么，点进去就能到官方页面看介绍和报名方式。</p>
      <div class="actions">

    <article class="spot" id="spot" aria-live="polite">

</div></div>

<section class="stage" id="stage" aria-label="课程转盘" data-cursor="拖动">

<div class="bands">

  <section class="library" id="library">

  <footer>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/SplitText.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const {reduce,hasGsap,esc,catVar}=KZ;
const CATS=KZ_CATS,COURSES=KZ_COURSES,N=COURSES.length;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");

/* 统计、跑马灯、课程目录面板 */
const plats=new Set(COURSES.map(c=>c.platform));
const teachers=[...new Set(COURSES.flatMap(c=>c.teacher.split("、").map(t=>t.split(" ")[0])))];
const cats=new Set(COURSES.map(c=>c.cat));
$("#stats").innerHTML=[[N,"门课程"],[teachers.length,"位讲师"],[cats.size,"种分类"],[plats.size,"个平台"]]
  .map(([n,l])=>`<div><b data-n="${n}">${n}</b><span>${l}</span></div>`).join("");
const fill=(el,list)=>{const h=list.map(w=>`<span>${esc(w)}</span>`).join("");el.innerHTML=h+h};
fill($("#band1"),[...CATS,...teachers,...new Set(COURSES.map(c=>c.format))]);
fill($("#band2"),COURSES.map(c=>c.learn));
$("#libText").textContent=`全部 ${N} 门课程，可以按分类、讲师筛选，也能搜关键词，把想看的课收藏起来。`;
$("#fan").innerHTML=COURSES.slice(0,3).map(c=>`<span style="--c:${catVar(c.cat)}">${KZ.img(c)}</span>`).join("");
$("#spotTotal").textContent=pad(N);

/* 转盘卡片 */
const ringEl=$("#ring");
ringEl.innerHTML=COURSES.map((c,i)=>`<a class="slot" href="${esc(c.url)}" target="_blank" rel="noopener" draggable="false" data-i="${i}" style="--c:${catVar(c.cat)}" aria-label="${esc(c.title)}">
  <span class="sc">${KZ.img(c)}</span>
  <span class="sh"><span>${esc(c.code)}</span><i></i></span>
  <span class="st">${esc(c.title)}</span></a>`).join("");
const slots=[...ringEl.children];
const step=Math.PI*2/N;
const geo={R:520,sw:156,tilt:.3,depth:.55,spread:reduce?1:0,spin:reduce?0:Math.PI*1.2};
let angle=0,target=0,cur=0;

function measure(){
  const w=innerWidth;
  geo.sw=w<520?108:w<900?132:156;
  geo.R=Math.min(560,Math.max(200,w*.4));
  geo.tilt=w<520?.34:.3;
  document.documentElement.style.setProperty("--sw",geo.sw+"px");
  $("#stage").style.setProperty("--fw",(geo.R*2+geo.sw*2.2)+"px");
}
function layout(){
  const R=geo.R*geo.spread;
  let best=-2,front=0;
  slots.forEach((el,i)=>{
    const a=i*step+angle+geo.spin;
    const x=Math.sin(a)*R,z=Math.cos(a)*R*geo.depth,y=z*geo.tilt;
    const d=(Math.cos(a)+1)/2;            // 0 = 最后面, 1 = 最前面
    if(Math.cos(a)>best){best=Math.cos(a);front=i}
    const lift=el.classList.contains("front")?-16:0;
    el.style.transform=`translate3d(${x.toFixed(1)}px,${(y+lift).toFixed(1)}px,${z.toFixed(1)}px)`;
    el.style.opacity=(.28+.72*d*d).toFixed(3);
    el.style.zIndex=Math.round(d*100);
  });
  slots.forEach((el,i)=>el.classList.toggle("front",i===front));
}
const wrapAngle=a=>Math.atan2(Math.sin(a),Math.cos(a));

/* 推荐卡 */
const spotEls={cover:$("#spotCover"),cat:$("#spotCat"),no:$("#spotNo"),title:$("#spotTitle"),who:$("#spotWho"),learn:$("#spotLearn"),go:$("#spotGo"),idx:$("#spotIdx")};
function fillSpot(c,i){
  $("#spot").style.setProperty("--c",catVar(c.cat));
  spotEls.cover.href=c.url;spotEls.cover.innerHTML=KZ.img(c);
  spotEls.cat.innerHTML=`<i></i>${esc(c.cat)}`;
  spotEls.no.textContent=c.code;
  spotEls.title.href=c.url;spotEls.title.textContent=c.title;
  spotEls.who.textContent=`${c.teacher} · ${c.platform} · ${c.format}`;
  spotEls.learn.textContent=c.learn;
  spotEls.go.href=c.url;
  spotEls.idx.textContent=pad(i+1);
}
function restartBar(){const b=$("#bar");b.classList.remove("run");void b.offsetWidth;if(!reduce)b.classList.add("run")}
function feature(i,{instant=false}={}){
  i=(i%N+N)%N;
  const changed=i!==cur;cur=i;
  // 让这张卡转到正前方（走最短的方向）
  const want=-i*step;
  target=angle+wrapAngle(want-angle);
  if(instant)angle=target;
  const c=COURSES[i];
  if(hasGsap&&!reduce&&changed&&!instant){
    gsap.timeline()
      .to(".spot-body>*,.spot-head>*",{y:-14,opacity:0,duration:.25,stagger:.02,ease:"power2.in"})
      .to(".spot-cover",{clipPath:"inset(0 0 0 100%)",duration:.35,ease:"power3.in"},0)
      .add(()=>fillSpot(c,i))
      .set(".spot-cover",{clipPath:"inset(0 100% 0 0)"})
      .to(".spot-cover",{clipPath:"inset(0 0% 0 0)",duration:.6,ease:"expo.out"})
      .fromTo(".spot-body>*,.spot-head>*",{y:16,opacity:0},{y:0,opacity:1,duration:.5,stagger:.04,ease:"expo.out"},"<");
    // 保底：画面没在跑时，直接换成新的课
    setTimeout(()=>{if(cur===i&&spotEls.no.textContent!==c.code){fillSpot(c,i);gsap.set(".spot-cover,.spot-body>*,.spot-head>*",{clearProps:"all"})}},900);
  }else fillSpot(c,i);
  restartBar();
}
$("#bar").addEventListener("animationend",()=>feature(cur+1));
$("#prev").addEventListener("click",()=>feature(cur-1));
$("#next").addEventListener("click",()=>feature(cur+1));

/* 拖动转盘 */
const stage=$("#stage");
// 滑鼠在转盘上时，推荐卡暂停自动换课
stage.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")$("#bar").classList.add("hold")});
stage.addEventListener("pointerleave",()=>$("#bar").classList.remove("hold"));
let drag=null,moved=false;
stage.addEventListener("pointerdown",e=>{
  if(e.button!==0)return;
  drag={x:e.clientX,a:angle,t:performance.now()};moved=false;
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;
  if(!moved&&Math.abs(dx)>6){moved=true;stage.classList.add("dragging");try{stage.setPointerCapture(e.pointerId)}catch(_){}}
  if(moved){angle=drag.a+dx*.006;target=angle;if(reduce)layout()}
});
addEventListener("pointerup",()=>{
  if(!drag)return;
  stage.classList.remove("dragging");
  if(moved){const i=Math.round(-angle/step);feature(i)}
  drag=null;
});
ringEl.addEventListener("click",e=>{
  const s=e.target.closest(".slot");if(!s)return;
  if(moved){e.preventDefault();moved=false;return}
  if(!s.classList.contains("front")){e.preventDefault();feature(+s.dataset.i)} // 不是最前面那张：先转过来
});
// 键盘：左右键转动
stage.tabIndex=0;
stage.addEventListener("keydown",e=>{if(e.key==="ArrowRight")feature(cur+1);if(e.key==="ArrowLeft")feature(cur-1)});

/* 每一帧：角度慢慢追上目标 */
measure();feature(0,{instant:true});layout();
addEventListener("resize",()=>{measure();layout()});
if(!reduce){
  const tick=()=>{if(!drag)angle+=(target-angle)*.075;layout()};
  hasGsap?gsap.ticker.add(tick):(function loop(){tick();requestAnimationFrame(loop)})();
}

/* 开场动画 */
if(hasGsap&&!reduce){
  gsap.registerPlugin(ScrollTrigger,SplitText);
  const split=SplitText.create("#headline .line",{type:"chars",mask:"lines"});
  const path=$("#headline em path"),len=path.getTotalLength();
  gsap.set(path,{strokeDasharray:len,strokeDashoffset:len});
  const intro=gsap.timeline({defaults:{ease:"expo.out"}});
  intro.from(".top",{y:-30,opacity:0,duration:1})
    .from(".eyebrow",{x:-30,opacity:0,duration:.9},"<.1")
    .from(split.chars,{yPercent:115,rotate:6,duration:1.3,stagger:.055},"<.1")
    .to(path,{strokeDashoffset:0,duration:1.1,ease:"power3.inOut"},"-=.6")
    .from("#lede,.actions",{y:24,opacity:0,duration:1,stagger:.08},"<")
    .from(".stats div",{y:24,opacity:0,duration:.9,stagger:.07},"<.1")
    .from("#spot",{x:60,rotateY:-12,opacity:0,duration:1.4},.35)
    .to(geo,{spread:1,spin:0,duration:2.4,ease:"expo.out"},.5)
    .from(".floor",{scale:.4,opacity:0,duration:1.8},.5)
    .from(".hint",{opacity:0,y:10,duration:.8},1.6)
    .from(".band",{yPercent:120,opacity:0,duration:1.1,stagger:.12},1.2);
  document.querySelectorAll("#stats b").forEach(b=>{
    const o={v:0},end=+b.dataset.n;
    gsap.to(o,{v:end,duration:1.6,ease:"power2.out",delay:.9,onUpdate:()=>{b.textContent=Math.round(o.v)},onComplete:()=>{b.textContent=end}});
  });
  // 跑马灯跟着滚动速度倾斜
  const bands=gsap.utils.toArray(".band");
  ScrollTrigger.create({onUpdate:self=>{gsap.to(bands,{skewX:gsap.utils.clamp(-8,8,self.getVelocity()/280),duration:.5,ease:"power3.out",overwrite:true})}});
  // 往下滚：转盘慢慢后退、标题淡出
  gsap.to("#ring",{y:-40,scale:.92,ease:"none",scrollTrigger:{trigger:"#stage",start:"top 40%",end:"bottom top",scrub:true}});
  gsap.from(".library",{y:80,opacity:0,duration:1.2,ease:"expo.out",scrollTrigger:{trigger:".library",start:"top 88%"}});
  // 保底：浏览器没在画画面时（例如分页在背景），3 秒后直接把开场跑完
  setTimeout(()=>{if(gsap.ticker.frame<40){intro.progress(1);geo.spread=1;geo.spin=0;layout();gsap.set(".library",{y:0,opacity:1});document.querySelectorAll("#stats b").forEach(b=>b.textContent=b.dataset.n)}},3000);
}
</script>
</body>
</html>
