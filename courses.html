<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课程目录｜课栈</title>
<meta name="description" content="课栈精选课程目录：依分类、讲师筛选，每门课附封面、重点和官方页面链接。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<link rel="stylesheet" href="vendor/lenis.css">
<link rel="stylesheet" href="site.css">
<style>
.head{padding-block:clamp(28px,5vw,64px) 24px;display:grid;gap:12px}
.head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,6.5vw,80px);line-height:1.08;margin:0}
.head p{margin:0;color:var(--muted);max-width:36em}

.drawer{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:3px;padding:16px;display:grid;gap:14px;scroll-margin-top:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;padding:0 12px;background:var(--bg)}
.search input{border:0;background:transparent;padding:10px 0;width:100%;min-width:0;outline:none}
.search svg{flex:none;color:var(--muted)}
select{border:1px solid var(--line);border-radius:3px;background:var(--bg);padding:9px 10px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .25s,color .25s,border-color .25s}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--muted))}
.chip em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.7}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-family:var(--f-mono)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-block:24px 56px;perspective:1200px}
.card{min-width:0;display:flex}
.tilt{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:2px;display:flex;flex-direction:column;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px));transition:transform .5s var(--ease),box-shadow .5s ease}
.card:hover .tilt{--lift:-8px;box-shadow:0 30px 50px -30px var(--shadow)}
.tilt.tilting{transition:transform .1s linear,box-shadow .5s ease}
.tilt::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 62%);opacity:0;transition:opacity .35s ease}
.card:hover .tilt::after{opacity:1}
.cover{position:relative;display:block;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
.card:hover .cover img{transform:scale(1.08)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 8px;border-bottom:2px solid var(--rule)}
.cat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--c)}
.cat i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card-body{flex:1;padding:4px 16px 0;line-height:28px;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--ruled) 27px 28px)}
.card h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:28px;margin:0;text-wrap:balance}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.who{font-size:14px;color:var(--muted)}
.learn{font-size:14px}
.learn span{color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px 14px;margin-top:8px}
.save{border:1px solid var(--line);background:transparent;border-radius:3px;padding:5px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.save svg{width:14px;height:14px}
.save[aria-pressed="true"]{border-color:var(--mark);color:var(--mark)}
.save[aria-pressed="true"] path{fill:var(--mark)}
.go{font-size:13px;font-weight:500;text-decoration:none;color:var(--accent)}
.go:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:3px}
.empty strong{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:6px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:0 40px}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.pages button{min-width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.pages button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pages button:disabled{opacity:.4;cursor:default}
.range{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:480px){.row select{flex:1 1 40%}}
@media (prefers-reduced-motion:reduce){.tilt,.card:hover .tilt,.card:hover .cover img{transform:none}}
</style>
</head>
<body>
<canvas id="aurora" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="ring-cursor" aria-hidden="true"><span>看课</span></div>

<div class="gut"><div class="wrap">
  <header class="top">
    <a class="brand" href="./"><b>课栈</b><span>精选课程</span></a>
    <nav class="nav" aria-label="主导航">
      <a href="./">首页</a>
      <a href="#" id="nav-all">课程目录</a>
      <a href="#saved" id="nav-saved">我的收藏<span class="n" data-saved-n>0</span></a>
    </nav>
  </header>

  <section class="head">
    <div class="eyebrow" id="eyebrow">Library · 课程目录</div>
    <h1 id="headline">全部课程</h1>
    <p id="lede">按分类、讲师筛选，或直接搜你想学的东西。点封面就能到官方页面看介绍和报名方式。</p>
  </section>

  <section class="drawer" id="catalog" aria-label="筛选课程">
    <div class="row">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜课程名、讲师，或你想学的东西" autocomplete="off">
      </label>
      <select id="platform" aria-label="平台"></select>
      <select id="sort" aria-label="排序">
        <option value="default">最新课程</option>
        <option value="code">课程编号</option>
        <option value="teacher">按讲师</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="分类"></div>
    <div class="count" id="count"></div>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>

  <nav class="pager" aria-label="分页">
    <div class="range" id="range"></div>
    <div class="pages" id="pages"></div>
  </nav>

  <footer>
    <span>© 2026 课栈 · 课程封面与介绍版权归各平台及讲师所有，本站只做整理与导览。</span>
    <nav><a href="./">首页</a><a href="#">课程目录</a><a href="#saved">我的收藏</a></nav>
  </footer>
</div></div>

<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script src="vendor/SplitText.min.js"></script>
<script src="vendor/Flip.min.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="data.js"></script>
<script src="site.js"></script>
<script>
const {reduce,fine,hasGsap,esc,catVar,saved,persist,syncSavedCount}=KZ;
const CATS=KZ_CATS,COURSES=KZ_COURSES;
const $=s=>document.querySelector(s);
const PER=12;
const state={q:"",cat:"全部",platform:"全部",sort:"default",page:1};
const viewSaved=()=>location.hash==="#saved";

const plats=["全部",...new Set(COURSES.map(c=>c.platform))];
$("#platform").innerHTML=plats.map(p=>`<option value="${esc(p)}">${p==="全部"?"全部平台":esc(p)}</option>`).join("");
$("#platform").hidden=plats.length<=2;

function baseList(){return viewSaved()?COURSES.filter(c=>saved.has(c.code)):COURSES}
function filtered(ignoreCat){
  const q=state.q.trim().toLowerCase();
  return baseList().filter(c=>
    (ignoreCat||state.cat==="全部"||c.cat===state.cat)&&
    (state.platform==="全部"||c.platform===state.platform)&&
    (!q||[c.code,c.title,c.teacher,c.learn,c.platform].join(" ").toLowerCase().includes(q)));
}
function sorted(list){
  const l=[...list];
  if(state.sort==="default")l.sort((a,b)=>a.order-b.order);
  if(state.sort==="code")l.sort((a,b)=>a.code.localeCompare(b.code,"en",{numeric:true}));
  if(state.sort==="teacher")l.sort((a,b)=>a.teacher.localeCompare(b.teacher,"zh")||a.order-b.order);
  return l;
}
function renderChips(){
  const pool=filtered(true);
  $("#chips").innerHTML=["全部",...CATS].map(c=>{
    const n=c==="全部"?pool.length:pool.filter(x=>x.cat===c).length;
    const color=c==="全部"?"":` style="--c:${catVar(c)}"`;
    return `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${state.cat===c}"${color}>${c==="全部"?"":"<i></i>"}${esc(c)}<em>${n}</em></button>`;
  }).join("");
}
function card(c){
  const on=saved.has(c.code);
  return `<article class="card" data-flip-id="${esc(c.code)}" style="--c:${catVar(c.cat)}"><div class="tilt">
    <a class="cover" href="${esc(c.url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true" data-cursor="看课">${KZ.img(c)}</a>
    <div class="card-head"><span class="cat"><i></i>${esc(c.cat)}</span><span class="no">${esc(c.code)}</span></div>
    <div class="card-body">
      <h3><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a></h3>
      <div class="who">${esc(c.teacher)} · ${esc(c.platform)}</div>
      <div class="learn"><span>学什么：</span>${esc(c.learn)}</div>
      <div class="meta">形式 ${esc(c.format)}</div>
    </div>
    <div class="card-foot">
      <button class="save" type="button" data-id="${esc(c.code)}" aria-pressed="${on}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none"/></svg>
        <span>${on?"已收藏":"收藏"}</span></button>
      <a class="go" href="${esc(c.url)}" target="_blank" rel="noopener">去官方页面 →</a>
    </div>
  </div></article>`;
}

function render(){
  const sv=viewSaved();
  $("#nav-all").setAttribute("aria-current",sv?"false":"page");
  $("#nav-saved").setAttribute("aria-current",sv?"page":"false");
  syncSavedCount();
  $("#eyebrow").textContent=sv?"Wishlist · 我的收藏":"Library · 课程目录";
  $("#headline").textContent=sv?"我的收藏":"全部课程";
  $("#lede").textContent=sv?"你收藏起来、之后想看的课。收藏只存在这台设备的浏览器里，换手机或清除浏览记录就会不见。":"按分类、讲师筛选，或直接搜你想学的东西。点封面就能到官方页面看介绍和报名方式。";
  renderChips();
  const list=sorted(filtered(false));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  state.page=Math.min(state.page,pages);
  const start=(state.page-1)*PER;
  const slice=list.slice(start,start+PER);
  $("#count").innerHTML=`符合条件的课程 <b>${list.length}</b> 门`;
  if(!slice.length){
    $("#grid").innerHTML=sv&&!saved.size
      ?`<div class="empty"><strong>还没有收藏任何课</strong>回到课程目录，点卡片下方的「收藏」就会出现在这里。</div>`
      :`<div class="empty"><strong>没找到符合的课</strong>换个关键词，或把分类切回「全部」试试。</div>`;
  }else $("#grid").innerHTML=slice.map(card).join("");
  $("#range").textContent=pages>1?`第 ${start+1}–${start+slice.length} 门，共 ${list.length} 门`:"";
  let btns=`<button type="button" data-p="${state.page-1}" ${state.page===1?"disabled":""} aria-label="上一页">‹</button>`;
  for(let i=1;i<=pages;i++)btns+=`<button type="button" data-p="${i}" ${i===state.page?'aria-current="page"':""}>${i}</button>`;
  btns+=`<button type="button" data-p="${state.page+1}" ${state.page===pages?"disabled":""} aria-label="下一页">›</button>`;
  $("#pages").innerHTML=pages>1?btns:"";
}

// 筛选时：卡片滑到新位置，新出现的卡片放大淡入
function update(){
  if(!hasGsap||reduce||typeof Flip==="undefined"){render();return}
  const st=Flip.getState("#grid .card");
  render();
  const now=document.querySelectorAll("#grid .card");
  gsap.set(now,{opacity:1,y:0,rotateX:0});
  Flip.from(st,{targets:now,duration:.7,ease:"expo.out",stagger:.03,absolute:true,
    onEnter:els=>gsap.fromTo(els,{opacity:0,scale:.85,y:30},{opacity:1,scale:1,y:0,duration:.6,ease:"expo.out",stagger:.04})});
  if(typeof ScrollTrigger!=="undefined")ScrollTrigger.refresh();
}

$("#q").addEventListener("input",e=>{state.q=e.target.value;state.page=1;update()});
$("#platform").addEventListener("change",e=>{state.platform=e.target.value;state.page=1;update()});
$("#sort").addEventListener("change",e=>{state.sort=e.target.value;state.page=1;update()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.cat=b.dataset.cat;state.page=1;update()});
$("#pages").addEventListener("click",e=>{const b=e.target.closest("button[data-p]");if(!b||b.disabled)return;state.page=+b.dataset.p;update();KZ.scrollTo("#catalog")});
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".save");if(!b)return;const id=b.dataset.id;saved.has(id)?saved.delete(id):saved.add(id);persist();viewSaved()?update():render()});
window.addEventListener("hashchange",()=>{state.page=1;render();window.scrollTo(0,0)});

render();

if(hasGsap&&!reduce){
  gsap.registerPlugin(ScrollTrigger,SplitText,Flip);
  const split=SplitText.create("#headline",{type:"chars",mask:"lines"});
  const intro=gsap.timeline({defaults:{ease:"expo.out"}});
  intro.from(".top",{y:-30,opacity:0,duration:1})
    .from(".eyebrow",{x:-30,opacity:0,duration:.9},"<.1")
    .from(split.chars,{yPercent:115,rotate:6,duration:1.2,stagger:.06},"<.1")
    .from("#lede",{y:24,opacity:0,duration:1},"<.3")
    .from(".drawer",{y:40,opacity:0,duration:1},"<.1");
  const cards=gsap.utils.toArray("#grid .card");
  gsap.set(cards,{opacity:0,y:70,rotateX:-14,transformOrigin:"50% 0%"});
  ScrollTrigger.batch(cards,{start:"top 94%",once:true,onEnter:b=>gsap.to(b,{opacity:1,y:0,rotateX:0,duration:1.1,ease:"expo.out",stagger:.09,overwrite:true})});
  // 保底：浏览器没在画画面时（例如分页在背景），3 秒后直接显示全部内容
  setTimeout(()=>{if(gsap.ticker.frame<40){intro.progress(1);gsap.set("#grid .card",{opacity:1,y:0,rotateX:0})}},3000);
}

// 卡片 3D 倾斜 + 跟着游标的光
if(!reduce&&fine){
  let cur=null;
  const reset=c=>{if(!c)return;c.classList.remove("tilting");c.style.removeProperty("--rx");c.style.removeProperty("--ry")};
  $("#grid").addEventListener("pointermove",e=>{
    const c=e.target.closest(".tilt");
    if(c!==cur){reset(cur);cur=c}
    if(!c)return;
    const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.classList.add("tilting");
    c.style.setProperty("--rx",((.5-y)*8).toFixed(2)+"deg");
    c.style.setProperty("--ry",((x-.5)*10).toFixed(2)+"deg");
    c.style.setProperty("--mx",(x*100).toFixed(1)+"%");
    c.style.setProperty("--my",(y*100).toFixed(1)+"%");
  });
  $("#grid").addEventListener("pointerleave",()=>{reset(cur);cur=null});
}
</script>
</body>
</html>
